server {
    listen 80;
    listen 8000; # Keep 8000 for local development
    listen [::]:80;

    server_name localhost;

    # Set the root directory to your Laravel project's public folder
    root /var/www/html/public;

    # Define the default files to serve (index.php will be found in the root)
    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location / {
        # Try to serve the requested file directly, or a directory
        # If not found, internally rewrite the request to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Prevent Nginx from serving PHP files directly if they don't exist
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Forward the request to the PHP-FPM service
        fastcgi_pass app:9000; # Ensure 'app' matches your PHP-FPM service name

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_index index.php;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|woff|woff2|ttf|svg)$ {
        expires 30d;
        access_log off;
        log_not_found off;
    }
}
