name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: vendor/bin/pest --without-tty

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Sync Files and Run Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Navigate to the folder
            cd /var/www/html/blogApp

            # Fix git ownership issue
            git config --global --add safe.directory /var/www/html/blogApp

            # Discard local changes (e.g. config/cors.php) to allow pull
            git reset --hard

            # 2. Pull the latest code
            git pull origin main

            # 3. Install dependencies
            composer install --no-dev --optimize-autoloader

            # 4. Cache configuration (Helps PHP performance)
            php artisan config:clear
            php artisan cache:clear
            php artisan route:cache
            php artisan lighthouse:clear-cache

            # 5. Run migrations
            php artisan migrate --force
