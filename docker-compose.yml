version: '3.9'

services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=mysql
    depends_on:
        - mysql

  nginx:
    image: nginx:latest
    ports:
      - "80:80"    # Maps host port 80 to container port 80
      - "8000:8000" # Maps host port 8000 to container port 8000
    volumes:
      - .:/var/www/html
      - ./nginx.conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - mysql

  mysql:
    image: mysql
    container_name: mysql-blog
    volumes:
        - mysql_data:/var/lib/mysql
    environment:
        - MYSQL_ROOT_PASSWORD=laravel # Replace 'laravel' with your root password
        - MYSQL_DATABASE=laravel # Replace 'laravel' with your database name
        - MYSQL_USER=laravel # Replace 'laravel' with your database username
        - MYSQL_PASSWORD=laravel # Replace 'laravel' with your database password
    ports:
        - '3306:3306'

volumes:
  mongo-data:
  mysql_data:
