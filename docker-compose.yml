version: '3.9'

services:
  app:
    build: .
    restart: always
    volumes:
      - .:/var/www/html
    environment:
      - MONGO_URI=mongodb://db:27017

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"    # Maps host port 80 to container port 80
      - "8000:8000" # Maps host port 8000 to container port 8000
    volumes:
      - .:/var/www/html
      - ./nginx.conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db

  db:
    image: mongo:latest
    restart: always
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data: